  .hub { position: absolute; left: 50%; top: 50%; width: 15.5%; height: 15.5%; transform: translate(-50%, -50%); }

  #go:focus-visible, .round:focus-visible, .share:focus-visible, .lang:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

    display: flex; align-items: center; justify-content: space-between; gap: 12px;

  .round:disabled { opacity: .45; cursor: default; }
  .lang {
    display: flex; align-items: center; gap: 2px; height: 44px; padding: 4px;
    border-radius: 999px; background: var(--soft); font-size: 15px; font-weight: 600;
  }
  .lang span {
    display: grid; place-items: center; min-width: 58px; height: 36px; padding: 0 12px;
    border-radius: 999px; color: var(--muted);
  }
  .lang[data-active=zh] span:first-child,
  .lang[data-active=en] span:last-child { background: var(--blue); color: #fff; }
  .note { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.35; text-align: center; }
  dialog {
    width: min(calc(100vw - 32px), 460px); max-height: calc(100dvh - 48px);
    padding: 20px; border: 0; border-radius: 16px; color: var(--ink);

  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; border-bottom: 1px solid var(--soft); }
  .row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--blue); }
  select { font: inherit; padding: 6px 8px; border: 1px solid #d9dbe3; border-radius: 8px; background: #fff; color: inherit; }
  textarea {
    display: block; width: 100%; height: min(48dvh, 380px); padding: 10px;
    border: 1px solid #d9dbe3; border-radius: 10px; resize: vertical;
    font: inherit; font-size: 16px; line-height: 1.45; color: inherit;
  }
  .hint { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .error { margin: 8px 0 0; color: #d0413f; font-size: 13px; }
  .error:empty { display: none; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .btn { min-height: 40px; padding: 8px 14px; border-radius: 10px; background: var(--soft); font-size: 15px; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.left { margin-right: auto; }
  #toast {

    background: rgba(30, 30, 34, .88); color: #fff; font-size: 14px; text-align: center;

  }

  #gate { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #fff; }

  .gate-card p { margin: 0 0 6px; }
  .gate-card .actions { flex-wrap: wrap; justify-content: center; }
</style>

function isLight(hex) {

function drawLabelStacked(label, R, small, big) {
  const chars = Array.from(label.replace(/[《》]/g, ''));
  // largest size whose innermost glyph still fits the wedge at that radius
  const wedge = 2 * Math.tan(Math.PI / items.length);
  const fits = wedge * R * .965 / (1 + wedge * chars.length);
  const size = Math.max(small, Math.min(big, fits));
  const cap = Math.floor(R * .62 / size);
  const shown = chars.length > cap ? [...chars.slice(0, cap - 3), '·', '·', '·'] : chars;
  ctx.font = `600 ${size}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  shown.forEach((ch, i) => ctx.fillText(ch, 0, -R * .965 + size * (i + .5)));
}

function drawLabelLine(label, R, small, big) {
  const room = R * .62;
  ctx.font = `600 ${big}px ${FONT}`;
  const size = Math.max(small, Math.min(big, .97 * big * room / ctx.measureText(label).width));
  ctx.font = `600 ${size}px ${FONT}`;
  let text = label;
  while (text.length > 3 && ctx.measureText(text).width > room) text = text.slice(0, -2).trimEnd() + '…';
  ctx.rotate(Math.PI / 2);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, -R * .965, 0);
}

function randInt(n) {

  const buf = new Uint32Array(1);
  do crypto.getRandomValues(buf); while (buf[0] >= limit);
  return buf[0] % n;

  gain.gain.exponentialRampToValueAtTime(.0001, now + .03);
  osc.connect(gain).connect(audio.destination);
  osc.start(now);
  osc.stop(now + .03);
}
